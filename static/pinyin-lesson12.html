<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>拼音第十二课过关练习（编号11）· 练习卡</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2620; --muted:#8a8073;
  --line:#e3d9c6; --brand:#c8442a; --brand-soft:#fbe9e2;
  --ok:#2f7d52; --ok-soft:#e5f4ea; --bad:#c8442a;
  --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
  --pin: -apple-system, "Times New Roman", serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{padding:0 0 120px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 0}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(20px,4.4vw,28px);margin:0;letter-spacing:.5px}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:1px;margin-top:6px}
.no{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brand);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.card h2::after{content:"";flex:1;height:1px;background:var(--line)}
.syll{display:flex;flex-wrap:wrap;gap:10px}
.syl > span{font-family:var(--pin);font-size:24px;letter-spacing:1px;padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.syl .grp{background:#f2eee3;color:var(--ink);font-size:20px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{font-family:var(--font);font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;transition:.15s}
button:active{transform:scale(.97)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.ghost.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px 14px;text-align:center;position:relative;transition:.15s}
.item .py{font-family:var(--pin);font-size:19px;letter-spacing:.5px;color:#5b5347;word-break:break-word}
.item .hz{font-size:clamp(30px,7vw,42px);font-weight:700;letter-spacing:6px;margin-top:6px;line-height:1.15}
body.hide-hz .item .hz{color:transparent;background:repeating-linear-gradient(90deg,transparent 0 10px,var(--line) 10px 11px) bottom/100% 1px no-repeat;min-height:1.15em}
body.hide-hz .item .hz::after{content:"?";color:#d9d0c0;letter-spacing:0}
.item .mark{position:absolute;top:6px;right:8px;font-size:16px;opacity:0;transition:.15s}
.item.done{background:var(--ok-soft);border-color:#bfe0ca}
.item.done .mark{opacity:1}
.word-sort .item{text-align:left}
.word-sort .hz{font-size:20px;letter-spacing:1px}
.blocks{display:flex;gap:10px;flex-wrap:wrap}
.blk{width:64px;height:64px;border:2px solid var(--brand);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;background:#fff;cursor:pointer;transition:.15s}
.blk.revealed{border-color:var(--line);color:#cfc6b5;background:#faf7f0}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.qa button{font-size:26px;font-weight:700;letter-spacing:3px;padding:18px 8px}
.qa .res{font-size:12px;color:var(--muted);margin-top:6px;font-weight:400;letter-spacing:0}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 0}
.score{font-size:13px;color:var(--muted);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>拼音第十二课过关练习<small>前鼻韵母 · 拼读词语 · 认读生字</small></h1>
  <span class="no">编号（11）</span>
</header>

<div class="card">
  <h2>一、读读记记</h2>
  <div class="syll">
    <span class="grp">前鼻韵母（5个）</span>
    <span>an</span><span>en</span><span>in</span><span>un</span><span>ün</span>
  </div>
  <div class="syll" style="margin-top:10px">
    <span class="grp">整体认读音节</span>
    <span>yuan</span><span>yin</span><span>yun</span>
  </div>
  <div class="note">小口诀：an en in un ün —— 舌尖抵住上牙床，鼻子出声不出气；yuan/yin/yun 整体记，不用拆开拼。</div>
</div>

<div class="card">
  <h2>二、拼读词语 <span class="score" id="score">0 / 36</span></h2>
  <div class="toolbar">
    <button class="ghost" id="toggleHz">遮住汉字（看拼音猜）</button>
    <button id="resetAll">重新开始</button>
  </div>
  <div class="grid" id="words"></div>
</div>

<div class="card">
  <h2>三、认读生字</h2>
  <div class="qa" id="qa"></div>
  <div class="note">点一下卡片翻出自己的答案，再点“对 / 错”记分。</div>
</div>

<div class="card">
  <h2>默写模式（可选）</h2>
  <div class="note" style="margin-top:0">先点“遮住汉字”，在纸上写出词语，再点开对照。今天够了就不用做。</div>
</div>

<footer>家长可陪同；每次练 10 分钟，练完休息眼睛。</footer>
</div>

<script>
const WORDS = [["tiān ān mén","天安门"],["dàn gāo","蛋糕"],["guān kàn","观看"],["xiě zì běn","写字本"],["xún zhǎo","寻找"],["dān xīn","担心"],["tǎo lùn","讨论"],["chèn shān","衬衫"],["yuán zhū bǐ","圆珠笔"],["zǎo chén","早晨"],["lún chuán","轮船"],["dà yàn","大雁"],["zhú sǔn","竹笋"],["shān pō","山坡"],["zhǐ nán zhēn","指南针"],["guǒ yuán","果园"],["bái yún","白云"],["zuǒ yòu","左右"],["pīn yīn","拼音"],["zhuàn bǐ dāo","转笔刀"],["kàn diàn shì","看电视"],["shén huà","神话"],["shǐ jìn","使劲"],["chūn tiān","春天"],["qiān bǐ","铅笔"],["huān kuài","欢快"],["shēn tǐ","身体"],["yuán quān","圆圈"],["zhēn zhū","珍珠"],["tuán yuán","团圆"],["shù lín","树林"],["tián yě","田野"],["zhǔn bèi","准备"],["jūn duì","军队"],["yǔ sǎn","雨伞"],["hǎi tún","海豚"]];
const CHARS = ["大山","田地","左右","一片","一半","白云","她们"];
const wordsEl = document.getElementById('words');
const scoreEl = document.getElementById('score');
let done = new Set();

WORDS.forEach(([py,hz],i)=>{
  const d = document.createElement('div');
  d.className='item';
  d.innerHTML = '<div class="mark">✓</div><div class="py">'+py+'</div><div class="hz">'+hz+'</div>';
  d.addEventListener('click',()=>{
    if(done.has(i)){done.delete(i);d.classList.remove('done');}
    else{done.add(i);d.classList.add('done');}
    scoreEl.textContent = done.size + ' / ' + WORDS.length + (done.size===WORDS.length?' 🎉':'');
  });
  wordsEl.appendChild(d);
});

const qaEl = document.getElementById('qa');
CHARS.forEach(hz=>{
  const wrap = document.createElement('div');
  const b = document.createElement('button');
  b.innerHTML = '<span class="blk0">'+hz+'</span><div class="res">点一下遮住</div>';
  let hidden=false;
  b.addEventListener('click',()=>{
    hidden=!hidden;
    b.querySelector('.blk0').style.color = hidden ? 'transparent' : '';
    b.querySelector('.blk0').style.background = hidden ? 'repeating-linear-gradient(90deg,transparent 0 10px,#e3d9c6 10px 11px) bottom/100% 1px no-repeat' : '';
    b.querySelector('.blk0').style.textShadow = hidden ? '0 0 0 #cfc6b5' : '';
    b.querySelector('.res').textContent = hidden ? '想好了再点开' : '点一下遮住';
  });
  wrap.appendChild(b);
  qaEl.appendChild(wrap);
});

document.getElementById('toggleHz').addEventListener('click',e=>{
  document.body.classList.toggle('hide-hz');
  e.currentTarget.classList.toggle('on');
  e.currentTarget.textContent = document.body.classList.contains('hide-hz') ? '显示汉字' : '遮住汉字（看拼音猜）';
});
document.getElementById('resetAll').addEventListener('click',()=>{
  done.clear();
  [...wordsEl.children].forEach(c=>c.classList.remove('done'));
  scoreEl.textContent = '0 / ' + WORDS.length;
});
</script>
</body>
</html>
