<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>☀️ Noah暑期日历管理 - 2026年7-8月</title>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card-hover: #222244;
  --border: #2a2a4a;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --green: #00b894;
  --orange: #fdcb6e;
  --red: #e17055;
  --blue: #74b9ff;
  --pink: #fd79a8;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
.container { max-width: 920px; margin:0 auto; padding: 16px 12px; }

/* ─── Header ─── */
.header { text-align:center; padding:24px 0 16px; }
.header h1 {
  font-size:26px; font-weight:700;
  background: linear-gradient(135deg, var(--accent-light), var(--blue));
  -webkit-background-clip: text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header .subtitle { color:var(--text-dim); font-size:13px; margin-top:4px; }

/* ─── Stats ─── */
.stats { display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
.stat-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 18px; text-align:center; min-width:90px;
}
.stat-card .num { font-size:20px; font-weight:700; color:var(--accent-light); }
.stat-card .label { font-size:11px; color:var(--text-dim); margin-top:2px; }

/* ─── Period Legend ─── */
.legend { display:flex; gap:16px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; font-size:12px; }
.legend-item { display:flex; align-items:center; gap:5px; }
.legend-dot { width:10px; height:10px; border-radius:3px; }
.dot-am { background:#74b9ff; }
.dot-pm { background:#fdcb6e; }
.dot-eve { background:#e17055; }

/* ─── Calendar ─── */
.calendar-wrapper {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:20px;
}
.cal-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 16px; background:rgba(108,92,231,0.08); border-bottom:1px solid var(--border);
}
.cal-header h2 { font-size:17px; font-weight:600; white-space:nowrap; }
.cal-nav { display:flex; align-items:center; gap:8px; }
.cal-nav button {
  background:none; border:1px solid var(--border); color:var(--text);
  padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s;
}
.cal-nav button:hover { background:var(--accent); border-color:var(--accent); }
.today-btn {
  background:var(--accent); border:1px solid var(--accent); color:white;
  padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13px;
}

/* Day headers */
.weekdays {
  display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
  padding:6px 0; color:var(--text-dim); font-size:12px; font-weight:500;
  border-bottom:1px solid var(--border);
}
.weekdays span:first-child, .weekdays span:last-child { color:var(--red); }

/* Day cells */
.days { display:grid; grid-template-columns:repeat(7,1fr); }
.day-cell {
  min-height:90px; padding:4px; border-right:1px solid var(--border);
  border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s;
  position:relative;
}
.day-cell:nth-child(7n) { border-right:none; }
.day-cell:hover { background:rgba(108,92,231,0.06); }
.day-cell.other-month { opacity:0.2; }
.day-cell.today { background:rgba(108,92,231,0.1); }

.day-num {
  font-size:11px; font-weight:500; margin-bottom:2px; color:var(--text-dim);
  position:sticky; top:0;
}
.day-cell.today .day-num {
  background:var(--accent); color:white; border-radius:50%;
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
}

/* Period slots in day cell */
.day-periods { display:flex; flex-direction:column; gap:1px; }
.period-slot {
  font-size:8px; padding:1px 3px; border-radius:2px; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;
  line-height:1.3; min-height:14px;
}
.period-am { background:rgba(116,185,255,0.15); }
.period-pm { background:rgba(253,203,110,0.15); }
.period-eve { background:rgba(225,112,85,0.15); }
.period-all { background:rgba(0,184,148,0.15); }

/* ─── Project Filter Tabs ─── */
.project-tabs {
  display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;
}
.project-tab {
  padding:6px 14px; border-radius:20px; border:1px solid var(--border);
  background:var(--card); color:var(--text-dim); cursor:pointer;
  font-size:13px; transition:all .2s;
}
.project-tab:hover { border-color:var(--accent); color:var(--accent-light); }
.project-tab.active { background:var(--accent); border-color:var(--accent); color:white; }

/* ─── Event List ─── */
.event-section-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
}
.event-section-header h3 { font-size:17px; font-weight:600; }
.add-btn {
  background:var(--accent); border:none; color:white; padding:7px 16px;
  border-radius:8px; cursor:pointer; font-size:13px; font-weight:500;
}

.event-cards { display:flex; flex-direction:column; gap:8px; }
.event-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; display:flex; align-items:center; gap:12px;
  transition:all .2s; animation:fadeIn .3s ease;
}
.event-card:hover { background:var(--card-hover); border-color:var(--accent); }
.event-color { width:4px; height:44px; border-radius:2px; flex-shrink:0; }
.event-info { flex:1; min-width:0; }
.event-info .event-title { font-size:14px; font-weight:600; margin-bottom:1px; }
.event-info .event-meta { font-size:11px; color:var(--text-dim); display:flex; gap:8px; flex-wrap:wrap; }
.event-info .event-meta span { white-space:nowrap; }
.event-tag {
  display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px;
  background:rgba(108,92,231,0.15); color:var(--accent-light);
}
.event-actions { display:flex; gap:4px; flex-shrink:0; }
.event-actions button {
  background:none; border:1px solid var(--border); color:var(--text-dim);
  padding:5px 8px; border-radius:6px; cursor:pointer; font-size:11px; transition:all .2s;
}
.event-actions .ical-btn { border-color:var(--green); color:var(--green); }
.event-actions .ical-btn:hover { background:var(--green); color:var(--bg); }
.event-actions .edit-btn:hover { border-color:var(--blue); color:var(--blue); }
.event-actions .del-btn:hover { border-color:var(--red); color:var(--red); }

/* ─── Modal ─── */
.modal-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.6); z-index:1000; justify-content:center; align-items:center; padding:16px;
}
.modal-overlay.active { display:flex; }
.modal {
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:24px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto;
}
.modal h3 { font-size:18px; font-weight:600; margin-bottom:16px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:12px; color:var(--text-dim); margin-bottom:3px; font-weight:500; }
.form-group input,.form-group select {
  width:100%; padding:9px 11px; background:rgba(255,255,255,.04);
  border:1px solid var(--border); border-radius:8px; color:var(--text);
  font-size:13px; outline:none; transition:border-color .2s;
}
.form-group input:focus,.form-group select:focus { border-color:var(--accent); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.checkbox-group {
  display:flex; align-items:center; gap:8px; margin:8px 0;
}
.checkbox-group input[type="checkbox"] { width:auto; accent-color:var(--accent); }
.checkbox-group label { margin:0; display:inline; font-size:13px; }

.form-hint { font-size:11px; color:var(--text-dim); margin:-4px 0 10px; }

.radio-group {
  display:flex; gap:10px; flex-wrap:wrap; margin:6px 0;
}
.radio-group label {
  display:flex; align-items:center; gap:4px; font-size:12px;
  padding:6px 12px; border:1px solid var(--border); border-radius:6px;
  cursor:pointer; transition:all .2s;
}
.radio-group input[type="radio"] { accent-color:var(--accent); width:auto; }
.radio-group label:has(input:checked) {
  border-color:var(--accent); background:rgba(108,92,231,0.1);
}

.form-btns { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
.form-btns .btn-primary {
  background:var(--accent); border:none; color:white;
  padding:9px 22px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
}
.form-btns .btn-cancel {
  background:none; border:1px solid var(--border); color:var(--text-dim);
  padding:9px 22px; border-radius:8px; cursor:pointer; font-size:13px;
}

/* ─── Export ─── */
.export-wrap { text-align:center; margin-bottom:16px; }
.export-btn {
  background:var(--green); border:none; color:white; padding:8px 22px;
  border-radius:8px; cursor:pointer; font-size:13px; font-weight:500;
  transition:opacity .2s;
}
.export-btn:hover { opacity:.85; }

/* ─── Toast ─── */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--card); border:1px solid var(--border); padding:10px 22px;
  border-radius:10px; font-size:13px; font-weight:500; z-index:2000;
  opacity:0; transition:all .3s; pointer-events:none;
  white-space:nowrap; box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@keyframes fadeIn {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}

@media(max-width:600px) {
  .container { padding:8px 6px; }
  .header h1 { font-size:20px; }
  .day-cell { min-height:64px; padding:3px; }
  .day-num { font-size:10px; }
  .period-slot { font-size:7px; padding:0 2px; }
  .event-card { flex-wrap:wrap; }
  .event-actions { width:100%; justify-content:flex-end; }
  .form-row { grid-template-columns:1fr; }
  .stats { gap:6px; }
  .stat-card { min-width:70px; padding:6px 10px; }
  .stat-card .num { font-size:16px; }
  .cal-header { padding:8px 10px; }
  .project-tab { font-size:11px; padding:4px 10px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>☀️ Noah暑期日历</h1>
    <p class="subtitle">2026年7-8月 · 点击日期查看详情 · 上午/下午/晚上分栏</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">活动总数</div></div>
    <div class="stat-card"><div class="num" id="statDays">0</div><div class="label">覆盖天数</div></div>
    <div class="stat-card"><div class="num" id="statHours">0</div><div class="label">总学时(h)</div></div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-am"></div> 上午</div>
    <div class="legend-item"><div class="legend-dot dot-pm"></div> 下午</div>
    <div class="legend-item"><div class="legend-dot dot-eve"></div> 晚上</div>
  </div>

  <!-- Project Filter -->
  <div class="project-tabs" id="projectTabs">
    <div class="project-tab active" data-filter="all" onclick="filterProject('all')">📋 全部</div>
  </div>

  <!-- Calendar -->
  <div class="calendar-wrapper">
    <div class="cal-header">
      <div class="cal-nav">
        <button onclick="changeMonth(-1)">‹ 上月</button>
        <h2 id="calTitle">2026年7月</h2>
        <button onclick="changeMonth(1)">下月 ›</button>
      </div>
      <button class="today-btn" onclick="goToday()">今天</button>
    </div>
    <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="days" id="daysGrid"></div>
  </div>

  <!-- Export -->
  <div class="export-wrap">
    <button class="export-btn" onclick="exportAllICS()">📅 导出全部活动到日历 (.ics)</button>
  </div>

  <!-- Event List -->
  <div class="event-section">
    <div class="event-section-header">
      <h3>📋 活动列表</h3>
      <button class="add-btn" onclick="openAddModal()">+ 添加活动</button>
    </div>
    <div class="event-cards" id="eventList"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">添加活动</h3>
    <form id="eventForm" onsubmit="saveEvent(event)">
      <input type="hidden" id="editId" value="">

      <div class="form-group">
        <label>活动名称 *</label>
        <input type="text" id="formTitle" placeholder="如：万象城冰球" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>项目标签</label>
          <select id="formProject">
            <option value="Noah">👶 Noah</option>
            <option value="其他">📌 其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>颜色</label>
          <input type="color" id="formColor" value="#6c5ce7">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>开始日期 *</label>
          <input type="date" id="formStart" required>
        </div>
        <div class="form-group">
          <label>结束日期 *</label>
          <input type="date" id="formEnd" required>
        </div>
      </div>

      <!-- Period selector -->
      <div class="form-group">
        <label>时段</label>
        <div class="radio-group" id="periodRadios">
          <label><input type="radio" name="period" value="am" checked> 🌅 上午</label>
          <label><input type="radio" name="period" value="pm"> ☀️ 下午</label>
          <label><input type="radio" name="period" value="eve"> 🌙 晚上</label>
          <label><input type="radio" name="period" value="all"> 📅 全天</label>
        </div>
      </div>

      <div class="form-row" id="timeRow">
        <div class="form-group">
          <label>开始时间</label>
          <input type="time" id="formStartTime" value="09:00">
        </div>
        <div class="form-group">
          <label>结束时间</label>
          <input type="time" id="formEndTime" value="17:00">
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="formWeekdays" checked>
        <label for="formWeekdays">仅工作日（周一到周五）</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="formWeekends">
        <label for="formWeekends">仅周末（周六+周日）</label>
      </div>
      <p class="form-hint">工作日和周末只能选一个，都不勾则每天重复</p>

      <div class="form-group">
        <label>备注（选填）</label>
        <input type="text" id="formNote" placeholder="如：10:30-12:00冰上 / 12:20-13:00陆地">
      </div>

      <div class="form-btns">
        <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary">✓ 保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Data ─────────────────────────────────────────────────────
const STORAGE_KEY = 'summer_events_v3';
const VERSION_KEY = 'summer_version';
const STORAGE_VERSION = 3;

const DEFAULT_EVENTS = [
  { id:'hockey1',  title:'万象城冰球',   project:'Noah', start:'2026-07-06', end:'2026-07-12', period:'am', startTime:'10:30', endTime:'13:00', weekdaysOnly:false, weekendsOnly:false, color:'#00b894', note:'10:30-12:00冰上 / 12:20-13:00陆地' },
  { id:'engty1',   title:'学而思英语天阳', project:'Noah', start:'2026-07-06', end:'2026-07-17', period:'pm', startTime:'15:30', endTime:'17:30', weekdaysOnly:true,  weekendsOnly:false, color:'#6c5ce7', note:'' },
  { id:'think1',   title:'学而思思维奥体', project:'Noah', start:'2026-07-04', end:'2026-08-02', period:'pm', startTime:'14:00', endTime:'16:00', weekdaysOnly:false, weekendsOnly:true,  color:'#fdcb6e', note:'' },
  { id:'calli1',   title:'新东方奥体书法正音', project:'Noah', start:'2026-07-20', end:'2026-07-31', period:'am', startTime:'08:20', endTime:'12:30', weekdaysOnly:true,  weekendsOnly:false, color:'#a29bfe', note:'' },
  { id:'pinyin1',  title:'学而思拼音',    project:'Noah', start:'2026-08-17', end:'2026-08-28', period:'am', startTime:'10:20', endTime:'12:20', weekdaysOnly:true,  weekendsOnly:false, color:'#74b9ff', note:'' },
  { id:'basket1',  title:'篮球',          project:'Noah', start:'2026-08-17', end:'2026-08-28', period:'pm', startTime:'16:00', endTime:'17:30', weekdaysOnly:true,  weekendsOnly:false, color:'#e17055', note:'' },
];

// ─── Helpers ──────────────────────────────────────────────────
function pad(n) { return n.toString().padStart(2,'0'); }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function getDatesBetween(s,e) {
  const r=[]; let c=parseDate(s); const ed=parseDate(e);
  while(c<=ed) { r.push(dateStr(c)); c.setDate(c.getDate()+1); } return r;
}
function isWeekday(d) { const day=parseDate(d).getDay(); return day>=1 && day<=5; }
function getEventDates(evt) {
  const a=getDatesBetween(evt.start, evt.end);
  if (evt.weekdaysOnly) return a.filter(d=>isWeekday(d));
  if (evt.weekendsOnly) return a.filter(d=>!isWeekday(d));
  return a;
}
function minSinceMid(t) { if(!t)return 0; const[h,m]=t.split(':').map(Number); return h*60+m; }
function calcHours(evt) {
  if(evt.period==='all') return getEventDates(evt).length*6;
  const d=getEventDates(evt);
  const mins=minSinceMid(evt.endTime||'17:00')-minSinceMid(evt.startTime||'09:00');
  return Math.round(d.length*(mins/60)*10)/10;
}
function escHtml(s) {
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

// ─── Storage ──────────────────────────────────────────────────
function loadEvents() {
  const defaults=JSON.parse(JSON.stringify(DEFAULT_EVENTS));
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw && localStorage.getItem(VERSION_KEY)==STORAGE_VERSION) {
      const p=JSON.parse(raw);
      if(Array.isArray(p)&&p.length>0) return p;
    }
  }catch(e){}
  // Merge: keep user events that don't collide with default ids
  let user=[];
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) user=JSON.parse(raw).filter(e=>!defaults.some(d=>d.id===e.id));
  }catch(e){}
  const merged=[...defaults,...user];
  saveEvents(merged);
  return merged;
}
function saveEvents(evts) {
  localStorage.setItem(VERSION_KEY,STORAGE_VERSION);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(evts));
}

let events=loadEvents();
let currentMonth=6;
let currentYear=2026;
let activeProject='all';

// ─── Project filter ───────────────────────────────────────────
function buildProjectTabs() {
  const tabs=document.getElementById('projectTabs');
  const projects=new Set(events.map(e=>e.project||'其他'));
  let html=`<div class="project-tab ${activeProject==='all'?'active':''}" onclick="filterProject('all')">📋 全部</div>`;
  for(const p of [...projects].sort()) {
    const label=p==='Noah'?'👶 Noah':'📌 '+p;
    html+=`<div class="project-tab ${activeProject===p?'active':''}" onclick="filterProject('${p}')">${label}</div>`;
  }
  tabs.innerHTML=html;
}

function filterProject(p) {
  activeProject=p;
  buildProjectTabs();
  renderCalendar();
  renderEventList();
}

function getVisibleEvents() {
  if(activeProject==='all') return events;
  return events.filter(e=>(e.project||'其他')===activeProject);
}

// ─── Calendar Render ──────────────────────────────────────────
function renderCalendar() {
  const grid=document.getElementById('daysGrid');
  const title=document.getElementById('calTitle');
  title.textContent=`${currentYear}年${currentMonth+1}月`;

  const firstDay=new Date(currentYear,currentMonth,1).getDay();
  const daysInMonth=new Date(currentYear,currentMonth+1,0).getDate();
  const daysInPrev=new Date(currentYear,currentMonth,0).getDate();
  const today=dateStr(new Date());
  grid.innerHTML='';

  // Prev month trailing
  for(let i=firstDay-1;i>=0;i--) {
    const d=daysInPrev-i;
    const cell=document.createElement('div');
    cell.className='day-cell other-month';
    cell.innerHTML=`<div class="day-num">${d}</div>`;
    grid.appendChild(cell);
  }

  const visible=getVisibleEvents();

  // This month
  for(let d=1;d<=daysInMonth;d++) {
    const ds=`${currentYear}-${pad(currentMonth+1)}-${pad(d)}`;
    const cell=document.createElement('div');
    cell.className='day-cell';
    if(ds===today) cell.classList.add('today');

    const dayEvents=visible.filter(e=>getEventDates(e).includes(ds));

    // Group by period
    const am=dayEvents.filter(e=>e.period==='am');
    const pm=dayEvents.filter(e=>e.period==='pm');
    const eve=dayEvents.filter(e=>e.period==='eve');
    const allDay=dayEvents.filter(e=>e.period==='all'||!e.period);

    let periods='<div class="day-periods">';
    if(am.length) periods+=am.map(e=>`<div class="period-slot period-am" style="background:${e.color}55;color:${e.color}">&#127749; ${escHtml(e.title)}</div>`).join('');
    if(pm.length) periods+=pm.map(e=>`<div class="period-slot period-pm" style="background:${e.color}55;color:${e.color}">&#9728; ${escHtml(e.title)}</div>`).join('');
    if(eve.length) periods+=eve.map(e=>`<div class="period-slot period-eve" style="background:${e.color}55;color:${e.color}">&#127769; ${escHtml(e.title)}</div>`).join('');
    if(allDay.length) periods+=allDay.map(e=>`<div class="period-slot period-all" style="background:${e.color}55;color:${e.color}">&#128197; ${escHtml(e.title)}</div>`).join('');
    periods+='</div>';

    cell.innerHTML=`<div class="day-num">${d}</div>${periods}`;
    grid.appendChild(cell);
  }

  // Next month leading
  const totalCells=firstDay+daysInMonth;
  const remaining=(7-totalCells%7)%7;
  for(let d=1;d<=remaining;d++) {
    const cell=document.createElement('div');
    cell.className='day-cell other-month';
    cell.innerHTML=`<div class="day-num">${d}</div>`;
    grid.appendChild(cell);
  }

  updateStats();
}

// ─── Stats ────────────────────────────────────────────────────
function updateStats() {
  const visible=getVisibleEvents();
  const totalDays=new Set();
  let totalHours=0;
  visible.forEach(e=>{
    getEventDates(e).forEach(d=>totalDays.add(d));
    totalHours+=calcHours(e);
  });
  document.getElementById('statTotal').textContent=visible.length;
  document.getElementById('statDays').textContent=totalDays.size;
  document.getElementById('statHours').textContent=Math.round(totalHours);
}

// ─── Month nav ────────────────────────────────────────────────
function changeMonth(d) {
  currentMonth+=d;
  if(currentMonth<0){currentMonth=11;currentYear--;}
  if(currentMonth>11){currentMonth=0;currentYear++;}
  renderCalendar();
}
function goToday() {
  const n=new Date();
  currentMonth=n.getMonth();
  currentYear=n.getFullYear();
  renderCalendar();
}

// ─── Event List Render ────────────────────────────────────────
function renderEventList() {
  const list=document.getElementById('eventList');
  const visible=getVisibleEvents();
  if(visible.length===0) {
    list.innerHTML='<div class="empty-state" style="text-align:center;padding:30px;color:var(--text-dim);font-size:14px;">暂无活动，点击上方添加</div>';
    return;
  }

  const periodLabel={'am':'🌅 上午','pm':'☀️ 下午','eve':'🌙 晚上','all':'📅 全天'};

  list.innerHTML=visible.map(evt=>{
    const dates=getEventDates(evt);
    const firstDate=dates[0]||evt.start;
    const lastDate=dates[dates.length-1]||evt.end;
    const totalDays=dates.length;
    const timeStr=evt.period==='all'?'全天':`${evt.startTime||'?'} - ${evt.endTime||'?'}`;
    const hours=calcHours(evt);
    const projIcon=evt.project==='Noah'?'👶':'📌';
    const noteHtml=evt.note?`<span class="event-tag">${escHtml(evt.note)}</span>`:'';

    return `<div class="event-card" data-id="${evt.id}">
      <div class="event-color" style="background:${evt.color}"></div>
      <div class="event-info">
        <div class="event-title">${escHtml(evt.title)} <span class="event-tag">${periodLabel[evt.period||'all']}</span> ${noteHtml}</div>
        <div class="event-meta">
          <span>${projIcon} ${escHtml(evt.project||'其他')}</span>
          <span>📅 ${firstDate} ~ ${lastDate} · ${totalDays}天</span>
          <span>⏱ ${timeStr} · ${hours}h</span>
        </div>
      </div>
      <div class="event-actions">
        <button class="ical-btn" onclick="exportSingleICS('${evt.id}')">📅</button>
        <button class="edit-btn" onclick="openEditModal('${evt.id}')">✏️</button>
        <button class="del-btn" onclick="deleteEvent('${evt.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

// ─── Modal ────────────────────────────────────────────────────
function toggleMutualExcl() {
  const wd=document.getElementById('formWeekdays');
  const we=document.getElementById('formWeekends');
  wd.addEventListener('change',function(){if(this.checked)we.checked=false;});
  we.addEventListener('change',function(){if(this.checked)wd.checked=false;});
}

function openAddModal() {
  document.getElementById('modalTitle').textContent='添加活动';
  document.getElementById('editId').value='';
  document.getElementById('eventForm').reset();
  document.getElementById('formColor').value='#6c5ce7';
  document.getElementById('formProject').value='Noah';
  document.querySelector('input[name="period"][value="am"]').checked=true;
  document.getElementById('formAllDay') // not used, period replaces it
  document.getElementById('formWeekdays').checked=true;
  document.getElementById('formWeekends').checked=false;
  document.getElementById('modal').classList.add('active');
}

function openEditModal(id) {
  const evt=events.find(e=>e.id===id);
  if(!evt) return;
  document.getElementById('modalTitle').textContent='编辑活动';
  document.getElementById('editId').value=id;
  document.getElementById('formTitle').value=evt.title;
  document.getElementById('formColor').value=evt.color||'#6c5ce7';
  document.getElementById('formProject').value=evt.project||'其他';
  document.getElementById('formStart').value=evt.start;
  document.getElementById('formEnd').value=evt.end;
  const period=evt.period||'all';
  const radio=document.querySelector(`input[name="period"][value="${period}"]`);
  if(radio) radio.checked=true;
  document.getElementById('formStartTime').value=evt.startTime||'09:00';
  document.getElementById('formEndTime').value=evt.endTime||'17:00';
  document.getElementById('formWeekdays').checked=!!evt.weekdaysOnly;
  document.getElementById('formWeekends').checked=!!evt.weekendsOnly;
  document.getElementById('formNote').value=evt.note||'';
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function saveEvent(e) {
  e.preventDefault();
  const id=document.getElementById('editId').value;
  const title=document.getElementById('formTitle').value.trim();
  const color=document.getElementById('formColor').value;
  const project=document.getElementById('formProject').value;
  const start=document.getElementById('formStart').value;
  const end=document.getElementById('formEnd').value;
  const period=document.querySelector('input[name="period"]:checked')?.value||'am';
  const startTime=document.getElementById('formStartTime').value;
  const endTime=document.getElementById('formEndTime').value;
  const weekdaysOnly=document.getElementById('formWeekdays').checked;
  const weekendsOnly=document.getElementById('formWeekends').checked;
  const note=document.getElementById('formNote').value.trim();

  if(!title||!start||!end){showToast('请填写完整信息','#e17055');return;}
  if(start>end){showToast('结束日期不能早于开始日期','#e17055');return;}
  if(period!=='all'&&startTime>=endTime){showToast('结束时间必须晚于开始时间','#e17055');return;}

  if(id) {
    const idx=events.findIndex(e=>e.id===id);
    if(idx!==-1) events[idx]={...events[idx],title,color,project,start,end,period,startTime,endTime,weekdaysOnly,weekendsOnly,note};
  } else {
    const newId='evt_'+Date.now();
    events.push({id:newId,title,color,project,start,end,period,startTime,endTime,weekdaysOnly,weekendsOnly,note});
  }
  saveEvents(events);
  closeModal();
  buildProjectTabs();
  renderCalendar();
  renderEventList();
  showToast(id?'✅ 活动已更新':'✅ 活动已添加','#00b894');
}

function deleteEvent(id) {
  if(!confirm('确定要删除这个活动吗？')) return;
  events=events.filter(e=>e.id!==id);
  saveEvents(events);
  buildProjectTabs();
  renderCalendar();
  renderEventList();
  showToast('🗑️ 已删除','#e17055');
}

// ─── ICS Export ──────────────────────────────────────────────
function buildICS(evt) {
  const dates=getEventDates(evt);
  const now=new Date();
  const nowStr=now.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';

  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tars Summer Calendar//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const dtStart=evt.start.replace(/-/g,'');
  const dtEnd=evt.end.replace(/-/g,'');
  const uid=`${evt.id}@summer-calendar`;
  const isAllDay=evt.period==='all';
  const ds=isAllDay?`VALUE=DATE:${dtStart}`:`TZID=Asia/Shanghai:${dtStart}T${(evt.startTime||'0900').replace(':','')}00`;
  const de=isAllDay?`VALUE=DATE:${dtEnd}`:`TZID=Asia/Shanghai:${dtEnd}T${(evt.endTime||'1700').replace(':','')}00`;
  const desc=`项目:${evt.project||'其他'}${evt.note?'\n备注:'+evt.note:''}`;

  lines.push('BEGIN:VEVENT',`UID:${uid}`,`DTSTART;${ds}`,`DTEND;${de}`,`SUMMARY:${evt.title}`,`DESCRIPTION:暑期活动 - ${desc}`,`DTSTAMP:${nowStr}`);

  if(evt.weekendsOnly && dates.length>1) {
    lines.push(`RRULE:FREQ=WEEKLY;BYDAY=SA,SU;UNTIL=${dtEnd}T235959Z`);
  } else if(evt.weekdaysOnly && dates.length>1) {
    lines.push(`RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;UNTIL=${dtEnd}T235959Z`);
  } else if(dates.length>1) {
    lines.push(`RRULE:FREQ=DAILY;UNTIL=${dtEnd}T235959Z`);
  }
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}

function downloadICS(content,filename) {
  const blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function exportSingleICS(id) {
  const evt=events.find(e=>e.id===id);
  if(!evt)return;
  downloadICS(buildICS(evt),`${evt.title.replace(/\s+/g,'_')}.ics`);
  showToast(`📅 "${evt.title}" 已导出`, '#00b894');
}

function exportAllICS() {
  if(events.length===0){showToast('暂无活动','#e17055');return;}
  const now=new Date();
  const nowStr=now.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tars Summer Calendar//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:暑期活动'];
  events.forEach(evt=>{
    const dates=getEventDates(evt);
    const dtStart=evt.start.replace(/-/g,'');
    const dtEnd=evt.end.replace(/-/g,'');
    const uid=`${evt.id}@summer-calendar`;
    const isAllDay=evt.period==='all';
    const ds=isAllDay?`VALUE=DATE:${dtStart}`:`TZID=Asia/Shanghai:${dtStart}T${(evt.startTime||'0900').replace(':','')}00`;
    const de=isAllDay?`VALUE=DATE:${dtEnd}`:`TZID=Asia/Shanghai:${dtEnd}T${(evt.endTime||'1700').replace(':','')}00`;
    lines.push('BEGIN:VEVENT',`UID:${uid}`,`DTSTART;${ds}`,`DTEND;${de}`,`SUMMARY:${evt.title}`,`DESCRIPTION:暑期活动-${evt.project||'其他'}`,`DTSTAMP:${nowStr}`);
    if(evt.weekendsOnly&&dates.length>1) lines.push(`RRULE:FREQ=WEEKLY;BYDAY=SA,SU;UNTIL=${dtEnd}T235959Z`);
    else if(evt.weekdaysOnly&&dates.length>1) lines.push(`RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;UNTIL=${dtEnd}T235959Z`);
    else if(dates.length>1) lines.push(`RRULE:FREQ=DAILY;UNTIL=${dtEnd}T235959Z`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  downloadICS(lines.join('\r\n'),'summer_calendar_2026.ics');
  showToast('📅 全部活动已导出','#00b894');
}

// ─── Toast ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg,color='#00b894') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.color=color;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── Init ────────────────────────────────────────────────────
toggleMutualExcl();
buildProjectTabs();
renderCalendar();
renderEventList();
</script>
