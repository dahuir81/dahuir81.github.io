<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c9b184">
<title>司龄计算器 · 岁月为证</title>
<style>
:root{
  --ink:#3d2f1e; --brown:#4a3820; --bronze:#7a5a33; --paper:#e9dab4;
  --paper2:#e2cfa6; --line:#b39a6d; --seal:#a63a2b; --dim:#8d7c5e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color:var(--ink);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.30 0 0 0 0 0.23 0 0 0 0 0.13 0 0 0 0.05 0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>"),
    radial-gradient(1100px 520px at 50% -8%, #eeddb6, #dcc79a 45%, #c9b184);
  min-height:100vh;display:flex;justify-content:center;padding:40px 16px 64px;
}
.wrap{width:100%;max-width:820px}
header{text-align:center;margin-bottom:6px;position:relative}
.brand{display:flex;align-items:center;justify-content:center;gap:16px}
.seal{
  width:58px;height:58px;flex:0 0 58px;border:3px solid var(--seal);color:var(--seal);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:17px;font-weight:700;letter-spacing:4px;line-height:1.25;
  border-radius:8px;transform:rotate(-8deg);
  background:rgba(166,58,43,.07);box-shadow:inset 0 0 0 2px rgba(166,58,43,.22);
  font-family:"Kaiti SC","KaiTi","STKaiti",serif;
}
h1{font-size:34px;letter-spacing:8px;color:#4a2f14;font-weight:700}
.ganzhi{color:var(--bronze);font-size:13px;letter-spacing:4px;margin-top:8px}
.orn{color:var(--bronze);font-size:12px;letter-spacing:10px;margin-top:10px;opacity:.8}
.quote{
  text-align:center;padding:20px 18px;margin:18px 0 16px;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
  color:#5c3d1e;background:rgba(255,250,235,.35);
}
.quote .main{font-size:19px;letter-spacing:3px;font-weight:600;color:#7a3d22}
.quote .sub{font-size:13px;color:var(--dim);letter-spacing:2px;margin-top:8px}
.card{
  position:relative;background:linear-gradient(168deg,#f0e4c5,#e0cca2);
  border:1px solid #8a6d44;border-radius:6px;
  padding:30px 26px 26px;margin-bottom:20px;
  box-shadow:0 12px 32px rgba(62,47,31,.35), inset 0 0 46px rgba(138,109,68,.16);
}
.card::before,.card::after{
  content:"";position:absolute;left:-3px;right:-3px;height:11px;
  background:linear-gradient(180deg,#6b4e2c,#a9854f 45%,#6b4e2c);
  border-radius:6px;box-shadow:0 2px 5px rgba(0,0,0,.35);
}
.card::before{top:-6px}
.card::after{bottom:-6px}
label{display:block;color:var(--bronze);font-size:13px;letter-spacing:2px;margin-bottom:8px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.field{flex:1;min-width:200px}
input[type=date]{
  width:100%;background:#f4e9cd;border:1px solid #8a6d44;border-radius:6px;
  color:var(--ink);padding:12px 14px;font-size:16px;outline:none;font-family:inherit;
  box-shadow:inset 0 2px 5px rgba(90,68,36,.15);
}
input[type=date]:focus{border-color:var(--seal);box-shadow:inset 0 2px 5px rgba(90,68,36,.15), 0 0 0 2px rgba(166,58,43,.15)}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
.err{color:var(--seal);font-size:13px;margin-top:10px;display:none;letter-spacing:1px}
.big{text-align:center;padding:34px 22px 28px}
.big .num{
  font-size:74px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;
  color:#6b4e2c;font-family:"Noto Serif SC","Songti SC",serif;
  text-shadow:0 1px 0 rgba(255,250,230,.7), 0 -1px 1px rgba(0,0,0,.12);
}
.big .lbl{color:var(--bronze);margin-top:10px;font-size:14px;letter-spacing:2px}
.big .tenure{color:var(--ink);font-size:21px;margin-top:16px;font-weight:600;letter-spacing:1px}
.big .tenure small{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{
  background:rgba(244,233,205,.6);border:1px solid var(--line);border-radius:8px;
  padding:16px 10px;text-align:center;box-shadow:inset 0 1px 4px rgba(90,68,36,.1);
}
.stat .v{font-size:26px;font-weight:700;color:var(--seal);font-variant-numeric:tabular-nums;font-family:"Noto Serif SC","Songti SC",serif}
.stat .v.hot{color:var(--bronze)}
.stat .k{color:var(--bronze);font-size:12px;margin-top:6px;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 8px;text-align:left;border-bottom:1px dashed var(--line)}
th{color:var(--bronze);font-weight:600;font-size:12px;letter-spacing:2px;border-bottom:2px solid #8a6d44}
td{color:var(--brown)}
td.milestone{font-variant-numeric:tabular-nums;text-align:right;color:#7a3d22;font-weight:600}
td.milestone.past{color:var(--dim);font-weight:400}
.note{color:var(--dim);font-size:12px;line-height:2;margin-top:14px;letter-spacing:.5px}
footer{text-align:center;color:var(--dim);font-size:13px;letter-spacing:3px;margin-top:30px}
@media (max-width:480px){
  .big .num{font-size:56px}
  h1{font-size:25px;letter-spacing:5px}
  .seal{width:50px;height:50px;flex-basis:50px;font-size:15px}
  .quote .main{font-size:16px}
  .card{padding:24px 18px 22px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal">司龄</div>
      <h1>司龄计算器</h1>
    </div>
    <div class="ganzhi">丙午年 · 岁月为证</div>
    <div class="orn">❖ 一 一 ❖</div>
  </header>

  <div class="quote">
    <div class="main">「 日拱一卒无有尽 · 功不唐捐终入海 」</div>
    <div class="sub">致在岁月里深耕的人 —— 每一天，都算数</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="start">入职日期</label>
        <input type="date" id="start">
      </div>
      <div class="field">
        <label for="end">截止日期（默认今日）</label>
        <input type="date" id="end">
      </div>
    </div>
    <div class="err" id="err">截止日期不可早于入职日期</div>
  </div>

  <div class="card big" id="result" style="display:none">
    <div class="num" id="totalDays">0</div>
    <div class="lbl">在司总天数 · 自然日（含入职当天与截止当天）</div>
    <div class="tenure" id="tenure"></div>
  </div>

  <div class="card" id="statsCard" style="display:none">
    <div class="grid">
      <div class="stat"><div class="v hot" id="workDays">0</div><div class="k">工作日（剔除周末）</div></div>
      <div class="stat"><div class="v" id="weekends">0</div><div class="k">其中周末</div></div>
      <div class="stat"><div class="v" id="yearsCount">0</div><div class="k">整年数</div></div>
      <div class="stat"><div class="v" id="annivDays">0</div><div class="k">距下个周年</div></div>
    </div>
  </div>

  <div class="card" id="milestoneCard" style="display:none">
    <table>
      <thead><tr><th>里程碑</th><th>状态</th></tr></thead>
      <tbody id="milestoneBody"></tbody>
    </table>
    <p class="note">口径：自然日 = 截止日期 − 入职日期 + 1（入职当天即第 1 天）；工作日剔除周六、周日，不剔除法定节假日。数据仅保存在本机浏览器，不上传。</p>
  </div>

  <footer>岁月不居 · 时节如流 · 丙午年制</footer>
</div>

<script>
(function(){
  "use strict";
  var DAY = 86400000;
  var MILESTONES = [100, 365, 500, 1000, 1825, 3650, 5475, 7300, 9125, 10950, 18250];

  function $(id){ return document.getElementById(id); }

  function parseDate(v){
    if(!v) return null;
    var parts = v.split("-");
    if(parts.length !== 3) return null;
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function todayStr(){
    var t = new Date();
    return fmtDate(t);
  }

  function daysInMonth(y, m){
    return new Date(y, m+1, 0).getDate();
  }

  function calcTenure(start, end){
    var y = end.getFullYear() - start.getFullYear();
    var m = end.getMonth() - start.getMonth();
    var d = end.getDate() - start.getDate();
    if(d < 0){
      m--;
      var pm = end.getMonth() - 1;
      var py = end.getFullYear();
      if(pm < 0){ pm = 11; py--; }
      d += daysInMonth(py, pm);
    }
    if(m < 0){ y--; m += 12; }
    return {y:y, m:m, d:d};
  }

  function render(){
    var start = parseDate($("start").value);
    var end = parseDate($("end").value);
    var err = $("err");
    if(!start || !end){
      err.style.display = "none";
      return;
    }
    if(end < start){
      err.style.display = "block";
      return;
    }
    err.style.display = "none";

    var total = Math.round((end - start) / DAY) + 1;

    var work = 0, weekends = 0;
    var cur = new Date(start.getTime());
    while(cur <= end){
      var dow = cur.getDay();
      if(dow === 0 || dow === 6){ weekends++; } else { work++; }
      cur.setDate(cur.getDate() + 1);
    }

    var t = calcTenure(start, end);
    var tenureText = t.y + " 年 " + t.m + " 个月 " + t.d + " 天";
    var since = fmtDate(start) + " 入职至今";
    $("totalDays").textContent = total.toLocaleString("zh-CN");
    $("tenure").innerHTML = tenureText + "<small>" + since + "</small>";
    $("workDays").textContent = work.toLocaleString("zh-CN");
    $("weekends").textContent = weekends.toLocaleString("zh-CN");
    $("yearsCount").textContent = t.y;

    var nextAnniv = new Date(end.getFullYear(), start.getMonth(), start.getDate());
    if(nextAnniv <= end) nextAnniv.setFullYear(nextAnniv.getFullYear() + 1);
    var annivDays = Math.round((nextAnniv - end) / DAY);
    $("annivDays").textContent = annivDays + " 天";
    if(nextAnniv.getFullYear() - start.getFullYear() > 0){
      $("annivDays").textContent = annivDays + " 天（" + (nextAnniv.getFullYear() - start.getFullYear()) + " 周年）";
    }

    $("result").style.display = "block";
    $("statsCard").style.display = "block";
    $("milestoneCard").style.display = "block";

    var body = $("milestoneBody");
    body.innerHTML = "";
    MILESTONES.forEach(function(n){
      var target = new Date(start.getTime() + (n-1) * DAY);
      var tr = document.createElement("tr");
      var name = document.createElement("td");
      var st = document.createElement("td");
      name.textContent = n >= 1000 ? (n/1000) + " 千天" : n + " 天";
      if(target <= end){
        st.className = "milestone past";
        st.textContent = "已达成（" + fmtDate(target) + "）";
      } else {
        var left = Math.round((target - end) / DAY);
        st.className = "milestone";
        st.textContent = "还差 " + left.toLocaleString("zh-CN") + " 天（" + fmtDate(target) + "）";
      }
      tr.appendChild(name);
      tr.appendChild(st);
      body.appendChild(tr);
    });
  }

  function save(){
    try{
      localStorage.setItem("sc_start", $("start").value);
      localStorage.setItem("sc_end", $("end").value);
    }catch(e){}
  }

  function init(){
    var s = null, e = null;
    try{
      s = localStorage.getItem("sc_start");
      e = localStorage.getItem("sc_end");
    }catch(err){}
    $("start").value = s || "";
    $("end").value = e || todayStr();
    $("start").addEventListener("change", function(){ save(); render(); });
    $("end").addEventListener("change", function(){ save(); render(); });
    render();
  }

  init();
})();
</script>
</body>
</html>
